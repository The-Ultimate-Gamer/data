name: Validate and publish data

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: admin

      # The rules, export and validation live in the admin tool; CI uses them without the desktop window.
      - name: Unit tests
        run: cargo test --locked --no-default-features --manifest-path admin/Cargo.toml

      # Fails if the database is inconsistent or the committed JSON is out of date.
      - name: Validate database and JSON
        run: cargo run --locked --no-default-features --manifest-path admin/Cargo.toml -- validate

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: data/

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  # Builds the full admin app (with the desktop window); independent of publishing the data.
  admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: admin

      - name: Format
        run: cargo fmt --manifest-path admin/Cargo.toml --check

      - name: Lint
        run: cargo clippy --locked --all-targets --manifest-path admin/Cargo.toml -- -D warnings

      - name: Tests (with the desktop app)
        run: cargo test --locked --manifest-path admin/Cargo.toml
