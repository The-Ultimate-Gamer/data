[package]
name = "ug-admin"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "All-in-one admin tool for The Ultimate Gamer tournament data"
publish = false

[[bin]]
name = "ug-admin"
path = "src/main.rs"

[features]
default = ["gui"]
# The desktop window. CI builds without it (`--no-default-features`) to run export/validate headless.
gui = ["dep:eframe", "dep:egui_extras", "dep:rfd", "dep:image"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
directories = "6"
flate2 = "1"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled", "backup", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
tar = "0.4"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
ureq = { version = "3", features = ["json"] }

eframe = { version = "0.33", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui_extras = { version = "0.33", optional = true, features = ["file", "image"] }
rfd = { version = "0.15", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
